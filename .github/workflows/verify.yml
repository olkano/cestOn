name: Isolated Windows verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/check-runtime.mjs
      - run: npm ci --ignore-scripts
      - run: node scripts/check-native.mjs
      - run: npm exec -- playwright install chromium
      - run: npm run check:export
      - run: ./scripts/ci-owner.ps1
      # Bundles stay on the disposable runner. No upload, deployment or native credentials.
